<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Onchain Chaos — Host Screen</title>
<style>
  :root {
    --violet: #8b5cf6;
    --violet-bright: #a78bfa;
    --bg: #08080c;
    --panel: #101018;
    --panel-border: #26263a;
    --text: #f2f2f8;
    --text-dim: #8e8ea8;
    --ok: #35d07f;
    --warn: #e05252;
    --under: #5b6b8c;
    --team-left: #2f6fed;
    --team-right: #ed8f2f;
    --team-hold: #2fed8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden;
    height: 100vh;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
  }
  .panel-title {
    font-size: 1vw;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 1.2vh;
  }
  .badge {
    position: fixed;
    top: 18px;
    left: 18px;
    background: var(--violet);
    color: #0a0612;
    font-weight: 800;
    font-size: 0.9vw;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 999px;
  }
  #container { max-width: 78vw; margin: 0 auto; padding: 3vh 0 2vh; }

  .title-logo {
    display: block;
    margin: 1vh auto 2.5vh;
    height: 9vh;
    filter: drop-shadow(0 0 18px rgba(139, 92, 246, 0.35));
  }

  #status-banner {
    text-align: center;
    font-size: 1.5vw;
    font-weight: 800;
    min-height: 2.4vw;
    color: var(--violet-bright);
    margin-bottom: 1.5vh;
  }
  #operator-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 2vh;
    font-size: 0.95vw;
    color: var(--text-dim);
  }
  #operator-row button {
    border: 0;
    border-radius: 10px;
    padding: 9px 18px;
    font-size: 0.95vw;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: 1px;
    color: #0a0612;
    background: var(--violet);
    cursor: pointer;
  }
  #operator-row button.secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--panel-border);
  }

  #track-panel { padding: 3vh 3vw; margin-bottom: 2.5vh; }
  #track-wrap {
    position: relative;
    height: 14vh;
  }
  #track-line {
    position: absolute;
    left: 4%;
    right: 4%;
    top: 50%;
    border-top: 3px dotted var(--panel-border);
  }
  #robot, #coin, #wallet-icon {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  #robot { font-size: 5vw; z-index: 2; }
  #coin { font-size: 2.4vw; z-index: 1; }
  #wallet-icon { right: 2%; left: auto; transform: translate(50%, -50%); font-size: 3.2vw; }
  #coin.slipping { animation: shake 0.15s infinite; }
  @keyframes shake { 0%{ margin-left:-3px } 50%{ margin-left:3px } 100%{ margin-left:-3px } }

  #bars-panel { padding: 2.5vh 3vw; margin-bottom: 2.5vh; }
  .bar-row { display: flex; align-items: center; gap: 2vw; margin-bottom: 1.6vh; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label {
    width: 6vw;
    font-size: 1vw;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .bar-label.team-left { color: var(--team-left); }
  .bar-label.team-hold { color: var(--team-hold); }
  .bar-label.team-right { color: var(--team-right); }
  .bar-outer {
    position: relative;
    flex: 1;
    height: 3.2vh;
    background: #191925;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
  }
  .bar-fill {
    position: absolute;
    left: 0; bottom: 0; top: 0;
    width: 0%;
    border-radius: 999px;
    background: var(--under);
    transition: width 0.05s linear, background 0.15s linear;
  }
  .bar-fill.under { background: var(--under); }
  .bar-fill.ontarget { background: var(--ok); }
  .bar-fill.over { background: var(--warn); }
  .bar-target-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 3px;
    background: var(--violet-bright);
  }
  .bar-state {
    width: 9vw;
    text-align: right;
    font-size: 0.85vw;
    font-weight: 800;
  }

  #log-panel { padding: 2.5vh 3vw; height: 20vh; display: flex; flex-direction: column; }
  #log-list {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column-reverse;
    gap: 0.6vh;
    font-size: 0.95vw;
  }
  .log-row { display: flex; gap: 14px; color: var(--text-dim); }
  .log-time { opacity: 0.6; }
  .log-name { font-weight: 800; }
  .log-name.team-left { color: var(--team-left); }
  .log-name.team-hold { color: var(--team-hold); }
  .log-name.team-right { color: var(--team-right); }

  .screen { display: none; }
  .screen.active { display: block; }

  #lobby-screen.active { display: flex; }
  #lobby-screen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 20px;
  }
  #lobby-sub { font-size: 1.1vw; color: var(--text-dim); margin-bottom: 1.5vh; }
  #lobby-url {
    font-size: 1.3vw;
    font-weight: 800;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 14px 26px;
    margin-bottom: 3vh;
  }
  #lobby-player-count { font-size: 1.3vw; color: var(--violet-bright); font-weight: 800; margin-bottom: 1.5vh; }
  #lobby-players {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 80vw;
    margin-bottom: 4vh;
    min-height: 4vw;
  }
  .player-chip {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 1vw;
    font-weight: 800;
    color: #0a0612;
  }
  .player-chip.team-left { background: var(--team-left); color: #fff; }
  .player-chip.team-right { background: var(--team-right); color: #fff; }
  .player-chip.team-hold { background: var(--team-hold); }
  #lobby-start-button {
    border: 0;
    border-radius: 14px;
    padding: 18px 56px;
    font-size: 1.6vw;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: 2px;
    color: #0a0612;
    background: var(--violet);
    cursor: pointer;
  }
  #lobby-start-button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

  <div id="lobby-screen" class="screen active">
    <div class="badge">LOBBY</div>
    <img class="title-logo" src="/assets/logo.png" alt="Onchain Chaos" />
    <div id="lobby-sub">Open this link on your phone to join:</div>
    <div id="lobby-url">Loading controller URL...</div>
    <div id="lobby-player-count">0 players joined</div>
    <div id="lobby-players"></div>
    <button id="lobby-start-button">START ROUND</button>
  </div>

  <div id="game-screen" class="screen">
    <div class="badge">MAIN GAME SCREEN</div>
    <div id="container">
      <img class="title-logo" src="/assets/logo.png" alt="Onchain Chaos" />
      <div id="status-banner"></div>
      <div id="operator-row">
        <button id="start-button">START ROUND</button>
        <button class="secondary" id="reset-button">RESET</button>
        <div>Players: <span id="team-counts">0 / 0 / 0</span></div>
        <div>Hold steady: <span id="win-timer">0.0</span>s / 3.0s</div>
      </div>

      <div id="track-panel" class="panel">
        <div id="track-wrap">
          <div id="track-line"></div>
          <div id="robot">🤖</div>
          <div id="coin">🪙</div>
          <div id="wallet-icon">👛</div>
        </div>
      </div>

      <div id="bars-panel" class="panel">
        <div class="panel-title">Progress</div>
        <div class="bar-row">
          <div class="bar-label team-left">LEFT</div>
          <div class="bar-outer"><div class="bar-fill" id="bar-left"></div><div class="bar-target-line" id="line-left"></div></div>
          <div class="bar-state" id="state-left"></div>
        </div>
        <div class="bar-row">
          <div class="bar-label team-hold">HOLD</div>
          <div class="bar-outer"><div class="bar-fill" id="bar-hold"></div><div class="bar-target-line" id="line-hold"></div></div>
          <div class="bar-state" id="state-hold"></div>
        </div>
        <div class="bar-row">
          <div class="bar-label team-right">RIGHT</div>
          <div class="bar-outer"><div class="bar-fill" id="bar-right"></div><div class="bar-target-line" id="line-right"></div></div>
          <div class="bar-state" id="state-right"></div>
        </div>
      </div>

      <div id="log-panel" class="panel">
        <div class="panel-title">Log</div>
        <div id="log-list"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const robotEl = document.getElementById('robot');
    const coinEl = document.getElementById('coin');
    const statusBanner = document.getElementById('status-banner');
    const winTimerEl = document.getElementById('win-timer');
    const startButton = document.getElementById('start-button');
    const resetButton = document.getElementById('reset-button');
    const teamCountsEl = document.getElementById('team-counts');
    const lobbyScreen = document.getElementById('lobby-screen');
    const gameScreen = document.getElementById('game-screen');
    const lobbyUrlEl = document.getElementById('lobby-url');
    const lobbyPlayerCountEl = document.getElementById('lobby-player-count');
    const lobbyPlayersEl = document.getElementById('lobby-players');
    const lobbyStartButton = document.getElementById('lobby-start-button');
    const logListEl = document.getElementById('log-list');

    fetch('/api/join-urls')
      .then((res) => res.json())
      .then((data) => {
        lobbyUrlEl.innerHTML = data.urls
          .map((url) => `<div>${url}</div>`)
          .join('');
      })
      .catch(() => {
        lobbyUrlEl.textContent = window.location.origin + '/controller.html';
      });

    function showScreen(name) {
      lobbyScreen.classList.toggle('active', name === 'lobby');
      gameScreen.classList.toggle('active', name === 'game');
    }

    function startRound() { fetch('/api/start', { method: 'POST' }); }
    startButton.addEventListener('click', startRound);
    resetButton.addEventListener('click', () => fetch('/api/reset', { method: 'POST' }));
    lobbyStartButton.addEventListener('click', startRound);

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderLobbyPlayers(players) {
      lobbyPlayerCountEl.textContent = `${players.length} player${players.length === 1 ? '' : 's'} joined`;
      lobbyPlayersEl.innerHTML = players
        .map((p) => `<div class="player-chip team-${p.team}">${escapeHtml(p.username)}</div>`)
        .join('');
      lobbyStartButton.disabled = players.length === 0;
    }
    socket.on('lobby', ({ players }) => renderLobbyPlayers(players));

    const MAX_LOG_ROWS = 8;
    socket.on('tapped', ({ username, team }) => {
      const row = document.createElement('div');
      row.className = 'log-row';
      const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
      row.innerHTML = `<span class="log-time">${time}</span><span class="log-name team-${team}">${escapeHtml(username)}</span><span>tapped ${team.toUpperCase()}</span>`;
      logListEl.appendChild(row);
      while (logListEl.children.length > MAX_LOG_ROWS) {
        logListEl.removeChild(logListEl.firstChild);
      }
    });

    function setBar(team, power, target) {
      const fill = document.getElementById('bar-' + team);
      const line = document.getElementById('line-' + team);
      const stateEl = document.getElementById('state-' + team);
      fill.style.width = power + '%';
      line.style.left = target + '%';

      let cls = 'under', label = 'UNDER';
      if (power > target + 8) { cls = 'over'; label = 'TOO MUCH'; }
      else if (power >= target - 8) { cls = 'ontarget'; label = 'ON TARGET ✅'; }
      fill.className = 'bar-fill ' + cls;
      stateEl.textContent = label;
      stateEl.style.color = cls === 'ontarget' ? 'var(--ok)' : (cls === 'over' ? 'var(--warn)' : 'var(--text-dim)');
    }

    socket.on('state', (s) => {
      showScreen(s.status === 'waiting' ? 'lobby' : 'game');
      if (s.players) renderLobbyPlayers(s.players);

      setBar('left', s.left.power, s.left.target);
      setBar('right', s.right.power, s.right.target);
      setBar('hold', s.hold.power, s.hold.target);

      const pct = (s.robot.x / s.trackWidth) * 100;
      const coinPct = (s.coin.x / s.trackWidth) * 100;
      robotEl.style.left = pct + '%';
      coinEl.style.left = coinPct + '%';

      coinEl.classList.toggle('slipping', s.coin.held && s.hold.power < s.hold.target && s.hold.power > 0);
      coinEl.style.display = s.coinDropped ? 'none' : 'block';

      winTimerEl.textContent = s.winTimer.toFixed(1);
      if (s.teamCounts) {
        teamCountsEl.textContent = `${s.teamCounts.left} LEFT / ${s.teamCounts.hold} HOLD / ${s.teamCounts.right} RIGHT`;
      }

      if (s.status === 'won') {
        statusBanner.textContent = '🎉 CROWD WINS — MINTING CHAMPION NFT 🎉';
      } else if (s.status === 'dropped') {
        statusBanner.textContent = '💥 COIN DROPPED — resetting...';
      } else if (!s.coin.held) {
        statusBanner.textContent = 'GET TO THE COIN — HOLD TO PICK IT UP';
      } else {
        statusBanner.textContent = 'COIN GRABBED — DELIVER IT TO THE WALLET';
      }
    });
  </script>
</body>
</html>
