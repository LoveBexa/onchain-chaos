<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Onchain Chaos — Controller</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; height: 100%;
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    background: #08080c;
    color: #f2f2f8;
  }
  #wrap { height: 100%; }
  .screen {
    height: 100%;
    display: none;
    flex-direction: column;
  }
  .screen.active { display: flex; }

  .title-logo {
    display: block;
    margin: 14px auto 4px;
    max-width: 82vw;
    height: auto;
    filter: drop-shadow(0 0 14px rgba(139, 92, 246, 0.35));
  }
  .sub {
    text-align: center;
    font-size: 4vw;
    color: #8e8ea8;
    padding: 0 8px;
  }

  /* --- join screen --- */
  #join-screen { justify-content: center; align-items: stretch; padding: 24px; gap: 16px; }
  #username-input {
    margin: 20px 12px 0;
    padding: 18px;
    font-size: 6vw;
    font-family: inherit;
    text-align: center;
    border-radius: 14px;
    border: 3px solid #26263a;
    background: #101018;
    color: #fff;
    outline: none;
  }
  #username-input:focus { border-color: #8b5cf6; }
  #join-button {
    margin: 16px 12px 0;
    padding: 20px;
    font-size: 6vw;
    font-weight: 900;
    font-family: inherit;
    letter-spacing: 1px;
    border: none;
    border-radius: 14px;
    background: #8b5cf6;
    color: #0a0612;
  }
  #join-button:active { filter: brightness(1.1); }

  /* --- lobby wait screen --- */
  #lobby-screen { justify-content: center; align-items: center; gap: 14px; padding: 24px; text-align: center; }
  #lobby-username { color: #a78bfa; font-weight: 900; }
  .waiting-msg { font-size: 4.4vw; font-weight: 800; margin-top: 10px; }
  .spinner {
    margin-top: 18px;
    width: 12vw; height: 12vw;
    border-radius: 50%;
    border: 6px solid #26263a;
    border-top-color: #8b5cf6;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #wallet-section { margin-top: 22px; }
  #connect-wallet-button {
    padding: 14px 20px;
    font-size: 3.8vw;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: 0.5px;
    border: none;
    border-radius: 12px;
    background: #8b5cf6;
    color: #0a0612;
  }
  #connect-wallet-button:disabled { opacity: 0.5; }
  #wallet-status { margin-top: 10px; font-size: 3.2vw; color: #8e8ea8; min-height: 4vw; }

  /* --- game screen --- */
  #game-screen {
    flex: 1;
    padding: 24px 20px;
    max-width: 460px;
    width: 100%;
    margin: 0 auto;
  }
  #round-state {
    text-align: center;
    font-weight: 800;
    font-size: 5.5vw;
    min-height: 5vw;
    margin-bottom: 10px;
    color: #a78bfa;
  }
  #mini-bar-outer {
    margin: 0 0 10px;
    height: 28px;
    background: #191925;
    border-radius: 999px;
    position: relative;
    overflow: hidden;
    border: 2px solid #26263a;
  }
  #mini-bar-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    border-radius: 999px;
    background: #5b6b8c;
  }
  #mini-target-line {
    position: absolute; top: 0; bottom: 0; width: 3px; background: #a78bfa;
  }
  #mini-state {
    text-align: center;
    font-weight: 800;
    font-size: 4vw;
    min-height: 5vw;
    margin-bottom: 10px;
  }
  #big-button {
    flex: 1;
    margin: 0;
    border-radius: 24px;
    border: none;
    font-size: 9.5vw;
    font-weight: 900;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #big-button:active { filter: brightness(1.3); }
  #big-button:disabled { opacity: 0.45; filter: grayscale(0.4); }
  .team-left { background: #2f6fed; }
  .team-right { background: #ed8f2f; }
  .team-hold { background: #2fed8f; color: #06210f; }

  /* --- guess screen --- */
  #guess-screen { justify-content: center; align-items: stretch; padding: 24px; gap: 10px; text-align: center; }
  #guess-input {
    margin: 14px 12px 0;
    padding: 18px;
    font-size: 9vw;
    font-family: inherit;
    text-align: center;
    border-radius: 14px;
    border: 3px solid #26263a;
    background: #101018;
    color: #fff;
    outline: none;
  }
  #guess-input:focus { border-color: #8b5cf6; }
  #guess-submit-button {
    margin: 14px 12px 0;
    padding: 20px;
    font-size: 5.5vw;
    font-weight: 900;
    font-family: inherit;
    letter-spacing: 1px;
    border: none;
    border-radius: 14px;
    background: #8b5cf6;
    color: #0a0612;
  }
  #guess-timer { margin-top: 10px; font-size: 3.8vw; color: #8e8ea8; }

  /* --- result screen --- */
  #result-screen { justify-content: center; align-items: center; padding: 24px; text-align: center; }
  .result-winner { font-size: 11vw; font-weight: 900; color: #ffd54a; text-shadow: 0 0 24px rgba(255, 213, 74, 0.5); }
  .result-amount { font-size: 7vw; font-weight: 900; color: #35d07f; margin-top: 14px; }
  .result-normal { font-size: 5.5vw; font-weight: 800; color: #c9d6ff; }
  .result-detail { font-size: 3.8vw; color: #8e8ea8; margin-top: 14px; }

  /* --- celebration screen --- */
  #celebration-screen { justify-content: center; align-items: center; padding: 24px; text-align: center; background: radial-gradient(circle at 50% 40%, rgba(255, 213, 74, 0.14), transparent 60%); }
  .celebration-text {
    font-size: 13vw;
    font-weight: 900;
    color: #ffd54a;
    text-shadow: 0 0 30px rgba(255, 213, 74, 0.6);
    animation: pulse 1s ease-in-out infinite;
  }
  .celebration-sub { font-size: 4.4vw; font-weight: 800; color: #a78bfa; margin-top: 14px; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
</style>
</head>
<body>
<div id="wrap">

  <div id="join-screen" class="screen active">
    <img class="title-logo" src="/assets/logo.png" alt="Onchain Chaos" />
    <div class="sub">Enter your name to join the room</div>
    <input id="username-input" maxlength="14" placeholder="Your name" autocomplete="off" autocapitalize="words" />
    <button id="join-button">JOIN</button>
  </div>

  <div id="lobby-screen" class="screen">
    <img class="title-logo" src="/assets/logo.png" alt="Onchain Chaos" />
    <div class="sub">You're in, <span id="lobby-username"></span>!</div>
    <div class="waiting-msg">Waiting for the host to start...</div>
    <div class="spinner"></div>
    <div id="wallet-section">
      <button id="connect-wallet-button">CONNECT WALLET &amp; BUY IN</button>
      <div id="wallet-status"></div>
    </div>
  </div>

  <div id="celebration-screen" class="screen">
    <div class="celebration-text">🎉 CROWD WINS! 🎉</div>
    <div class="celebration-sub">Get ready to guess your taps...</div>
  </div>

  <div id="game-screen" class="screen">
    <div id="round-state">PLAY NOW</div>
    <div id="mini-bar-outer"><div id="mini-bar-fill"></div><div id="mini-target-line"></div></div>
    <div id="mini-state"></div>
    <button id="big-button">...</button>
  </div>

  <div id="guess-screen" class="screen">
    <img class="title-logo" src="/assets/logo.png" alt="Onchain Chaos" />
    <div id="guess-prompt">
      <div class="sub">🎉 THE CROWD WON! How many times do you think YOU tapped?</div>
      <input id="guess-input" type="number" inputmode="numeric" min="0" placeholder="Your guess" />
      <button id="guess-submit-button">SUBMIT GUESS</button>
      <div id="guess-timer"></div>
    </div>
    <div id="guess-submitted" style="display:none;">
      <div class="waiting-msg">Guess submitted — waiting for the leaderboard...</div>
      <div class="spinner"></div>
    </div>
  </div>

  <div id="result-screen" class="screen">
    <div id="result-content"></div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  const joinScreen = document.getElementById('join-screen');
  const lobbyScreen = document.getElementById('lobby-screen');
  const gameScreen = document.getElementById('game-screen');
  const celebrationScreen = document.getElementById('celebration-screen');
  const guessScreen = document.getElementById('guess-screen');
  const resultScreen = document.getElementById('result-screen');

  const usernameInput = document.getElementById('username-input');
  const joinButton = document.getElementById('join-button');
  const lobbyUsernameEl = document.getElementById('lobby-username');

  const walletSection = document.getElementById('wallet-section');
  const connectWalletButton = document.getElementById('connect-wallet-button');
  const walletStatusEl = document.getElementById('wallet-status');

  const roundState = document.getElementById('round-state');
  const bigButton = document.getElementById('big-button');
  const miniFill = document.getElementById('mini-bar-fill');
  const miniLine = document.getElementById('mini-target-line');
  const miniState = document.getElementById('mini-state');

  const guessPrompt = document.getElementById('guess-prompt');
  const guessSubmitted = document.getElementById('guess-submitted');
  const guessInput = document.getElementById('guess-input');
  const guessSubmitButton = document.getElementById('guess-submit-button');
  const guessTimerEl = document.getElementById('guess-timer');

  const resultContent = document.getElementById('result-content');

  let joined = false;
  let myTeam = null;
  let myUsername = '';
  let hasGuessed = false;
  let walletAddress = null;
  let config = null;
  // DEMO mode: free buy-in, no wallet needed, for presentation safety — see server.js's fakeMode.
  // Defaults true until /api/config or a live 'state'/'lobby' broadcast says otherwise.
  let fakeMode = true;
  const EMOJI_LABELS = { left: 'LEFT', right: 'RIGHT', hold: 'HOLD' };

  fetch('/api/config')
    .then((r) => r.json())
    .then((c) => {
      config = c;
      fakeMode = !!c.fakeMode;
      // hide the buy-in section only if REAL mode is selected but the server has no pot wallet
      // configured — DEMO mode never needs one, so the button always shows in that case.
      if (!fakeMode && !c.potWalletAddress) walletSection.style.display = 'none';
    })
    .catch(() => {});

  function short(addr) { return addr ? addr.slice(0, 6) + '…' + addr.slice(-4) : ''; }

  function screens() {
    return {
      join: joinScreen, lobby: lobbyScreen, game: gameScreen,
      celebration: celebrationScreen, guess: guessScreen, result: resultScreen,
    };
  }
  function showScreen(name) {
    for (const el of Object.values(screens())) el.classList.remove('active');
    screens()[name].classList.add('active');
  }

  function doJoin() {
    const name = usernameInput.value.trim().slice(0, 14);
    socket.emit('join', { username: name });
  }
  joinButton.addEventListener('click', doJoin);
  usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doJoin(); });

  socket.on('joined', ({ team, username }) => {
    joined = true;
    myTeam = team;
    myUsername = username;
    lobbyUsernameEl.textContent = username;
    bigButton.textContent = EMOJI_LABELS[team];
    bigButton.className = 'team-' + team;
    showScreen('lobby');
  });

  // if the connection drops and reconnects, re-join automatically so the player doesn't
  // have to retype their name mid-round
  socket.on('connect', () => {
    if (joined) socket.emit('join', { username: myUsername });
  });

  function updateWalletUI(mySelf) {
    if (!config) return;
    if (!fakeMode && !config.potWalletAddress) return;
    const paid = mySelf && mySelf.paid;
    if (paid) {
      connectWalletButton.disabled = true;
      connectWalletButton.textContent = fakeMode ? 'BOUGHT IN ✅ (DEMO)' : 'BOUGHT IN ✅';
      walletStatusEl.textContent = fakeMode ? '' : (walletAddress ? short(walletAddress) : '');
    } else if (fakeMode) {
      buyInBusy = false; // new round started (paid reset) — allow buying in again
      connectWalletButton.disabled = false;
      connectWalletButton.textContent = `BUY IN — DEMO (${config.buyInMon} MON, not real)`;
      walletStatusEl.textContent = '';
    } else if (walletAddress) {
      buyInBusy = false;
      connectWalletButton.disabled = false;
      connectWalletButton.textContent = `BUY IN (${config.buyInMon} MON)`;
      walletStatusEl.textContent = `Connected: ${short(walletAddress)}`;
    } else {
      buyInBusy = false;
      connectWalletButton.disabled = false;
      connectWalletButton.textContent = `CONNECT WALLET & BUY IN (${config.buyInMon} MON)`;
    }
  }

  let buyInBusy = false; // extra guard beyond the disabled attribute — see connectWallet()

  function fakeBuyIn() {
    if (buyInBusy) return;
    buyInBusy = true;
    connectWalletButton.disabled = true;
    connectWalletButton.textContent = 'BUYING IN (DEMO)...';
    socket.emit('fakeBuyIn');
    // no ack needed — the next 'lobby'/'state' broadcast reports paid:true and updateWalletUI
    // takes it from there, same as the real flow does after a transaction confirms.
  }

  function handleBuyInClick() {
    if (fakeMode) fakeBuyIn();
    else connectWallet();
  }

  async function connectWallet() {
    if (!config || buyInBusy) return;
    // Mobile browsers don't have window.ethereum — bounce into MetaMask's own in-app
    // browser, which does, then the user lands back on this same page to finish connecting.
    if (typeof window.ethereum === 'undefined') {
      const dappUrl = window.location.href.replace(/^https?:\/\//, '');
      window.location.href = `https://metamask.app.link/dapp/${dappUrl}`;
      return;
    }
    buyInBusy = true;
    connectWalletButton.disabled = true;
    try {
      connectWalletButton.textContent = 'CONNECTING...';
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      walletAddress = accounts[0];

      // Ack tells us if this address already paid this round — matters because MetaMask's
      // mobile in-app browser can reload mid-flow, handing back a fresh socket connection that
      // would otherwise look unpaid and let someone get charged twice for one buy-in.
      const alreadyPaid = await new Promise((resolve) => {
        socket.emit('wallet', { address: walletAddress }, (ack) => resolve(!!(ack && ack.alreadyPaid)));
      });
      if (alreadyPaid) {
        connectWalletButton.textContent = 'BOUGHT IN ✅';
        walletStatusEl.textContent = `Connected: ${short(walletAddress)}`;
        return;
      }

      const chainId = await window.ethereum.request({ method: 'eth_chainId' });
      if (chainId !== config.chainIdHex) {
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: config.chainIdHex }],
          });
        } catch (switchErr) {
          await window.ethereum.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: config.chainIdHex,
              chainName: 'Monad Testnet',
              nativeCurrency: { name: 'MON', symbol: 'MON', decimals: 18 },
              rpcUrls: [config.rpcUrl],
              blockExplorerUrls: [config.explorerUrl],
            }],
          });
        }
      }

      connectWalletButton.textContent = 'CONFIRM BUY-IN IN METAMASK...';
      const txHash = await window.ethereum.request({
        method: 'eth_sendTransaction',
        params: [{
          from: walletAddress,
          to: config.potWalletAddress,
          value: '0x' + BigInt(config.buyInWei).toString(16),
        }],
      });
      socket.emit('buyIn', { txHash });
      connectWalletButton.textContent = 'BOUGHT IN ✅';
      walletStatusEl.textContent = `Connected: ${short(walletAddress)}`;
    } catch (err) {
      console.error('Wallet connect/buy-in failed', err);
      buyInBusy = false;
      connectWalletButton.disabled = false;
      connectWalletButton.textContent = `CONNECT WALLET & BUY IN (${config.buyInMon} MON)`;
      walletStatusEl.textContent = 'Failed or cancelled — try again';
    }
  }
  connectWalletButton.addEventListener('click', handleBuyInClick);

  guessSubmitButton.addEventListener('click', () => {
    const val = Number(guessInput.value);
    if (!Number.isFinite(val) || val < 0) return;
    hasGuessed = true;
    socket.emit('guess', { guess: val });
    guessPrompt.style.display = 'none';
    guessSubmitted.style.display = 'block';
  });

  socket.on('state', (s) => {
    if (!joined || !myTeam) return;
    if (s.fakeMode != null) fakeMode = !!s.fakeMode;

    if (s.status === 'waiting') {
      hasGuessed = false;
      guessInput.value = '';
      const mySelf = (s.players || []).find((p) => p.username === myUsername);
      updateWalletUI(mySelf);
      showScreen('lobby');
      return;
    }

    if (s.status === 'won') {
      showScreen('celebration');
      return;
    }

    if (s.status === 'guessing') {
      showScreen('guess');
      if (hasGuessed) {
        guessPrompt.style.display = 'none';
        guessSubmitted.style.display = 'block';
      } else {
        guessPrompt.style.display = 'block';
        guessSubmitted.style.display = 'none';
        const secsLeft = Math.max(0, Math.ceil((s.guessDeadline - Date.now()) / 1000));
        guessTimerEl.textContent = secsLeft + 's left';
      }
      return;
    }

    if (s.status === 'leaderboard') {
      showScreen('result');
      const isWinner = s.winnerUsername && s.winnerUsername === myUsername;
      if (isWinner) {
        resultContent.innerHTML = `
          <div class="result-winner">🏆 WINNER! 🏆</div>
          <div class="result-amount">You won ${s.potMon} MON</div>
          <div class="result-detail">Nice guessing, ${myUsername}!</div>
        `;
      } else {
        const list = s.leaderboard || [];
        const mine = list.find((p) => p.username === myUsername);
        const rank = list.findIndex((p) => p.username === myUsername) + 1;
        resultContent.innerHTML = mine
          ? `
            <div class="result-normal">You guessed ${mine.guess ?? '—'}, actually tapped ${mine.taps}</div>
            <div class="result-detail">Rank #${rank || '—'} — ${s.winnerUsername || 'someone'} won this round</div>
          `
          : `<div class="result-normal">${s.winnerUsername || 'Someone'} won this round</div>`;
      }
      return;
    }

    showScreen('game');
    const t = s[myTeam];
    miniFill.style.width = t.power + '%';
    miniLine.style.left = t.target + '%';
    let cls = '#5b6b8c', label = 'LOW — TAP MORE';
    if (t.power > t.target + 8) { cls = '#e05252'; label = 'HIGH — EASE OFF'; }
    else if (t.power >= t.target - 8) { cls = '#35d07f'; label = 'GOOD — HOLD IT'; }
    // HOLD gets a specific override once the robot's in the wallet zone — this is the moment
    // they need to deliberately stop tapping and let the grip drop, which is the win move now.
    if (myTeam === 'hold' && s.dropPrompt) { cls = '#ffd54a'; label = '✋ STOP — DROP IT NOW!'; }
    miniFill.style.background = cls;
    miniState.textContent = label;
    miniState.style.color = cls;
    bigButton.disabled = s.status !== 'playing';
    if (s.status === 'playing') {
      if (s.dropPrompt) roundState.textContent = myTeam === 'hold' ? 'DROP IT NOW!' : 'HOLD IS DROPPING IT — HOLD STEADY';
      else if (s.coin.held) roundState.textContent = 'CARRY TO WALLET';
      else if (s.coinDropped) roundState.textContent = 'COIN DROPPED — GO GET IT';
      else roundState.textContent = 'PLAY NOW';
    }
  });

  function tap(e) {
    e.preventDefault();
    if (navigator.vibrate) navigator.vibrate(10);
    socket.emit('tap');
  }
  bigButton.addEventListener('touchstart', tap, { passive: false });
  bigButton.addEventListener('mousedown', tap);
</script>
</body>
</html>
